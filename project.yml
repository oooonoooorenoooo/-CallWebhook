name: CallWebhook
options:
  bundleIdPrefix: de.reno
targets:
  CallWebhook:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - CallWebhook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reno.CallWebhook.U98PKCA4W7
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CallWebhook
        INFOPLIST_KEY_NSContactsUsageDescription: CallWebhook benötigt Zugriff auf deine Kontakte, um Namen und Kontaktbilder im Telefonbuch anzuzeigen.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: CallWebhook/CallWebhook.entitlements
