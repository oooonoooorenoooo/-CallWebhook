title: ComatAlarm
path: comatalarm
icon: mdi:airplane-cog
panel: true
cards:
- type: custom:button-card
  show_name: false
  show_icon: false
  triggers_update:
  - sensor.time
  tap_action:
    action: none
  hold_action:
    action: none
  styles:
    card:
    - padding: '0'
    - border-radius: 24px
    - overflow: visible
    - cursor: default
    grid:
    - grid-template-areas: '"content"'
    - grid-template-columns: 1fr
    custom_fields:
      content:
      - width: 100%
      - white-space: normal
      - text-align: left
      - pointer-events: auto
  custom_fields:
    content: |-
      [[[
      const card=this;
      const now=Date.now();
      const berlinDay=t=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t));
      const today=berlinDay(now), month=today.slice(0,7);
      if(!card._comatDay || !card._comatDay.startsWith(month)) card._comatDay=today;
      card._comatOpen=card._comatOpen||{};
      // button-card's shouldUpdate ignores a bare requestUpdate(). A named config
      // invalidation redraws the template immediately after an asynchronous response.
      const redraw=()=>{if(card.isConnected)card.requestUpdate('_config');};
      if(!card._comatBound && card.shadowRoot){
       card._comatBound=true;
       card.shadowRoot.addEventListener('toggle',event=>{
         const el=event.target;
         if(el.isConnected && el.matches?.('details[data-cm-key]')) card._comatOpen[el.dataset.cmKey]=el.open;
       },true);
       // Keep the parent button-card action handler from cancelling native touch
       // clicks or keyboard activation. Do not prevent scrolling/default actions.
       const control=event=>event.target.closest?.('.cm summary, .cm button[data-cm-day]');
       for(const type of ['touchstart','touchend','touchcancel','mousedown','keydown']){
         card.shadowRoot.addEventListener(type,event=>{if(control(event))event.stopPropagation();},true);
       }
       card.shadowRoot.addEventListener('click',event=>{
         const target=control(event);
         if(!target)return;
         event.stopPropagation();
         const details=target.tagName==='SUMMARY'?target.parentElement:null;
         if(details?.matches('details[data-cm-key]')){
           // Explicit toggle also works when the parent card cancels default actions.
           event.preventDefault();
           details.open=!details.open;
           card._comatOpen[details.dataset.cmKey]=details.open;
           return;
         }
         if(!target.dataset.cmDay)return;
         card._comatDay=target.dataset.cmDay;card._comatFetchAt=0;redraw();
       },true);
      }
      if (!card._comatBusy && (!card._comatFetchAt || now-card._comatFetchAt>14500)) {
        card._comatBusy=true; card._comatFetchAt=now;
        const requestedDay=card._comatDay;
        let timeout;
        Promise.race([
          hass.callApi('GET','callwebhook/comatalarm/monitor?day='+encodeURIComponent(requestedDay)),
          new Promise((_,reject)=>{timeout=setTimeout(()=>reject(new Error('timeout')),12000);})
        ]).then(data=>{
          card._comatData=data; card._comatError=''; card._comatReceived=Date.now();
        }).catch(error=>{
          const code=error?.status_code || error?.status;
          card._comatError=code===403 ? 'Nur mit einem Home-Assistant-Administratorkonto sichtbar.' : 'Pi-Monitor nicht erreichbar. Verbindung und Push-Dienst prüfen; erneuter Versuch erfolgt automatisch.';
        }).finally(()=>{clearTimeout(timeout);card._comatBusy=false;if(requestedDay!==card._comatDay)card._comatFetchAt=0;redraw();});
      }
      if(!card._comatTimer) card._comatTimer=setTimeout(()=>{card._comatTimer=null;redraw();},15000);
      const d=card._comatData;
      const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const clock=v=>typeof v==='number'&&v>0?new Date(v*1000).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Europe/Berlin'}):'—';
      const num=(v,factor=1,unit='')=>typeof v==='number'&&Number.isFinite(v)?Math.round(v*factor).toLocaleString('de-DE')+unit:'—';
      const age=v=>typeof v==='number'?v<60?Math.round(v)+' s':v<3600?Math.floor(v/60)+' min':Math.floor(v/3600)+' h '+Math.floor(v%3600/60)+' min':'unbekannt';
      const pill=(text,color='blue')=>`<span class="pill ${color}">${esc(text)}</span>`;
      const box=(label,value,sub='')=>`<div class="stat"><small>${esc(label)}</small><b>${esc(value)}</b><span>${esc(sub)}</span></div>`;
      const row=(label,value)=>`<div class="kv"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      const opened=key=>card._comatOpen[key]?' open':'';
      const section=(key,title,body,count='')=>`<details class="section" data-cm-key="${esc(key)}"${opened(key)}><summary><span>${esc(title)}</span>${count!==''?pill(count):''}</summary><div class="section-body">${body}</div></details>`;
      const flags={alarmTakeoff:'Abflug',alarmLanded:'Landung',alarmGate:'Gate',alarmParking:'Parkposition',alarmCancelled:'Annullierung',alarmDiverted:'Umleitung'};
      const message=v=>Object.entries(flags).reduce((s,[key,label])=>s.replaceAll(key,label),String(v||''));
      const css=`<style>
      .cm{color:var(--primary-text-color,#e6eef8);text-align:left;white-space:normal;font-family:var(--primary-font-family,system-ui);padding:clamp(12px,2vw,28px);background:linear-gradient(135deg,rgba(40,106,160,.14),transparent 50%);border-radius:24px;line-height:1.5}
      .cm *{box-sizing:border-box}.cm h1,.cm h2,.cm h3,.cm p{margin:0}.cm h1{font-size:clamp(25px,3vw,38px);letter-spacing:-1px}.cm h2{font-size:20px;margin:28px 0 12px}.cm h3{font-size:25px}.cm .muted,.cm small{color:var(--secondary-text-color,#9ca9ba)}.cm .hero{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:22px}.cm .eyebrow{font-size:11px;color:#53c9de;font-weight:800;letter-spacing:2px}.cm .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.cm .stat,.cm .api,.cm .flight,.cm .panel{border:1px solid rgba(130,156,190,.23);background:var(--card-background-color,#121a28);border-radius:18px;padding:18px}.cm .stat{display:flex;flex-direction:column}.cm .stat b{font-size:27px}.cm .stat span{font-size:12px;color:var(--secondary-text-color)}.cm .apis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.cm .api b{display:block;margin-bottom:8px}.cm .pill{display:inline-block;border-radius:30px;padding:4px 10px;background:rgba(74,142,255,.14);color:#629bff;font-size:12px;font-weight:700;overflow-wrap:anywhere}.cm .green{color:#50c994;background:rgba(45,180,120,.13)}.cm .orange{color:#f4a444;background:rgba(240,160,55,.13)}.cm .red{color:#f0737d;background:rgba(240,70,80,.13)}.cm .flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}.cm .flight-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.cm .flight{border-top:3px solid #55a4ee}.cm .route{font-size:18px;font-weight:600;margin:5px 0 12px}.cm .telemetry{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.cm .telemetry .stat{padding:10px;background:rgba(110,145,195,.07);border:0;border-radius:10px}.cm .telemetry b{font-size:20px}.cm .stale{opacity:.6}.cm .times{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-block:1px solid rgba(130,156,190,.2);padding:15px 0}.cm .times b{display:block;font-size:14px}.cm .kv{display:flex;justify-content:space-between;gap:15px;margin:7px 0;font-size:13px}.cm .kv span{color:var(--secondary-text-color)}.cm .kv strong{text-align:right;overflow-wrap:anywhere}.cm .prediction{margin:16px 0;padding:12px;background:rgba(65,172,171,.1);border-radius:10px}.cm .warn{padding:12px 16px;margin:12px 0;border-left:3px solid #eea54c;background:rgba(230,145,40,.1);border-radius:8px}.cm .scroll{max-height:500px;overflow:auto}.cm table{border-collapse:collapse;width:100%;font-size:13px}.cm td,.cm th{text-align:left;padding:10px;border-bottom:1px solid rgba(130,156,190,.18);vertical-align:top}.cm th{color:var(--secondary-text-color);font-weight:500}.cm td:last-child{overflow-wrap:anywhere}.cm .empty{padding:24px;color:var(--secondary-text-color);text-align:center}.cm .foot{font-size:12px;color:var(--secondary-text-color);margin-top:18px}.cm .device{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.cm .raw{font-size:12px;margin-top:12px}
      .cm .section{margin-top:14px;border:1px solid rgba(130,156,190,.23);border-radius:16px;overflow:hidden}.cm summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;min-height:58px;padding:15px 18px;font-weight:700}.cm summary::-webkit-details-marker{display:none}.cm summary:before{content:'›';font-size:24px;color:#629bff;transition:transform .15s}.cm details[open]>summary:before{transform:rotate(90deg)}.cm summary>span:first-of-type{flex:1}.cm summary:focus-visible,.cm button:focus-visible{outline:2px solid #629bff;outline-offset:-3px}.cm .section-body{padding:0 16px 16px}.cm .flight{padding:0;overflow:hidden}.cm .flight>summary{flex-wrap:wrap;align-items:center}.cm .flight-body{padding:0 18px 18px}.cm .flight-brief{flex:1;min-width:180px}.cm .flight-brief b{font-size:22px}.cm .flight-brief small{display:block;font-weight:400}.cm .day-picker{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.cm .day-picker button{font:inherit;color:inherit;background:rgba(100,140,190,.08);border:1px solid rgba(130,156,190,.23);border-radius:10px;min-width:42px;min-height:42px;cursor:pointer;position:relative}.cm .day-picker button[aria-pressed=true]{background:#3479db;color:white;border-color:#629bff}.cm .day-picker button.has-data:after{content:'';position:absolute;bottom:3px;left:calc(50% - 2px);width:4px;height:4px;background:#50c994;border-radius:50%}
      @media(max-width:600px){.cm .times{grid-template-columns:repeat(2,1fr)}.cm .telemetry{grid-template-columns:repeat(2,1fr)}.cm td,.cm th{padding:7px}.cm .panel{padding:10px}.cm .flight{padding:14px}}
      </style>`;
      if(!d)return css+`<div class="cm"><div class="eyebrow">PI · BETRIEBSÜBERSICHT</div><h1>ComatAlarm</h1><div class="warn">${esc(card._comatError||'Verbindung zum Pi wird hergestellt …')}</div><p class="muted">Die Übersicht zeigt die tatsächlichen Pi-Daten. Es werden keine zusätzlichen Fluganbieter-Abfragen ausgelöst.</p></div>`;
      const time=Date.now()/1000;
      const cycleAge=d.cycle_finished?time-d.cycle_finished:null;
      const cycleStale=cycleAge===null||cycleAge>120;
      const readStale=card._comatError||Date.now()-card._comatReceived>45000;
      const flights=d.flights||[];
      const apis=d.api_status?.results||{};
      const apiAge=d.api_status?.checked_at?time-d.api_status.checked_at:null;
      const renderFlights=(items,prefix)=>items.map(f=>{
       const live=f.live||{},s=f.schedule||{},subs=f.subscribers||[];
       const pa=typeof live.timestamp==='number'?Math.max(0,time-live.timestamp):null;
       const stale=pa===null||pa>120||live.timestamp>time+10;
       const status=subs.some(x=>x.status==='Überwacht')?'Überwacht':subs[0]?.status||'Unbekannt';
       const ts=k=>f[k]??s[k];
       const timeGrid=['std','etd','atd','sta','eta','ata','eibt','aibt'].map(k=>`<div><small>${k.toUpperCase()}</small><b>${clock(ts(k))}</b></div>`).join('');
       const eta=ts('eta'), remaining=typeof eta==='number'?eta-time:null;
       const rest=remaining===null?'—':remaining<0?'ETA überschritten':Math.ceil(remaining/60)+' min';
       const key=prefix+':'+[f.number,f.day,f.origin,f.destination].join('|');
       return `<details class="flight" data-cm-key="${esc(key)}"${opened(key)}><summary><div class="flight-brief"><b>${esc(f.number)}</b><small>${esc(f.origin||'?')} → ${esc(f.destination||'?')} · ${esc(f.registration||'—')} · ${esc(f.day)}</small><small>${esc(f.stand?'POS '+f.stand:f.prediction?.text?'Erwartet '+f.prediction.text:'Position offen')}</small></div>${pill(status,status==='Überwacht'?'green':'orange')}</summary><div class="flight-body"><div class="flight-head"><div><h3>${esc(f.number)}</h3><span class="muted">${esc(f.registration||'Registration fehlt')} · ${esc(s.aircraftType||live.type||'—')}</span></div>${pill(status,status==='Überwacht'?'green':'orange')}</div><div class="route">${esc(f.origin||'?')} → ${esc(f.destination||'?')} <small>· ${esc(f.day)}</small></div>
       <div>${pill(stale?'Positionsdaten veraltet / fehlen':'Position aktuell',stale?'orange':'green')} <small>Messung ${clock(live.timestamp)} · Alter ${age(pa)}</small></div>
       <div class="telemetry ${stale?'stale':''}">${box('Höhe',num(live.alt,.3048,' m'),'Quelle: FR24 · Fuß umgerechnet')}${box('Geschwindigkeit',num(live.gspeed,1.852,' km/h'),'Bodengeschwindigkeit')}${box('Distanz zum BER',num(f.distance_km,1,' km'),'Luftlinie aus letzter Position')}${box('Bis ETA',rest,'Zeitplan, keine Streckenberechnung')}</div>
       ${stale?'<p class="warn">Die Positionswerte sind keine aktuelle Fluglage. Alter und Messzeit oben beachten.</p>':''}
       <div class="times">${timeGrid}</div>
       <div class="prediction">${row('Parkposition',f.stand||'Nicht bestätigt')}${row('Erwartet',f.prediction?.text||'Keine Prognose vorhanden')}${row('Gate',f.gate||s.gate||'—')}${row('Gate-Quelle',f.gate_source||s.gate_source||'—')}</div>
       ${row('Pakete IN / OUT',`${f.packets?.in??'—'} / ${f.packets?.out??'—'}`)}
       ${row('Pi-Datenprüfung',clock(f.checked_at))}
       ${row('Vorflug',f.inbound?.number||'—')}${f.inbound?.number?row('AIBT des Vorflugs',clock(f.inbound.aibt)):''}
       ${f.outbound?.number?row('Folgeflug',f.outbound.number)+row('ATD Folgeflug',clock(f.outbound.atd)):''}
       <div class="raw">${row('Breite / Länge',`${live.lat??'—'} / ${live.lon??'—'}`)}${row('Kurs / Steigrate',`${num(live.track,1,'°')} / ${num(live.vspeed,.3048,' m/min')}`)}${row('Bodenmeldung',live.on_ground===true?'Am Boden':live.on_ground===false?'In der Luft':'—')}${row('FR24-ID / ICAO',`${f.fr24ID||'—'} / ${live.hex||'—'}`)}</div>
       <div class="device">${subs.map(x=>pill(x.device+': '+x.status,x.status==='Überwacht'?'green':'orange')).join('')}</div>
       ${subs.map(x=>row(x.device+' · letzter Zyklus',clock(x.last_poll))+row(x.device+' · App-Datenabruf',clock(x.last_app_read))).join('')}
       </div></details>`;
      }).join('');
      const events=d.events||[];
      const logs=(list)=>list.length?`<div class="scroll"><table><thead><tr><th>Zeit (Berlin)</th><th>Flug / Gerät</th><th>Ergebnis</th></tr></thead><tbody>${list.map(e=>`<tr><td>${clock(e.timestamp)}</td><td>${esc(e.flight||'Dienst')}<br><small>${esc(e.device)}</small></td><td>${pill(e.kind==='push_accepted'?'Apple angenommen':e.kind==='push_failed'?'Versand fehlgeschlagen':e.kind==='error'?'Fehler':e.kind==='push_skipped'?'Nicht gesendet':e.kind==='service'?'Dienst':'Ereignis',e.kind==='push_accepted'?'green':['error','push_failed'].includes(e.kind)?'red':'blue')}<br>${esc(message(e.message))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Seit Einrichtung des Monitors keine Einträge vorhanden.</div>';
      const categoryOf=f=>f.category||((f.cancelled||f.diverted||(f.origin==='BER'?f.atd:f.aibt))?'completed':f.atd||f.ata?'active':'waiting');
      const days=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();
      const monthTitle=new Date(today+'T12:00:00+01:00').toLocaleDateString('de-DE',{month:'long',year:'numeric',timeZone:'Europe/Berlin'});
      const history=d.history;
      const historyReady=history?.day===card._comatDay;
      const picker=Array.from({length:days},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0');return `<button type="button" data-cm-day="${date}" class="${history?.available_days?.includes(date)?'has-data':''}" aria-label="${date}" aria-pressed="${date===card._comatDay}">${String(i+1).padStart(2,'0')}</button>`;}).join('');
      const historyHtml=`<div class="day-picker" role="group" aria-label="Verlaufstag auswählen">${picker}</div><p class="muted">${esc(card._comatDay.split('-').reverse().join('.'))} · Punkt = gespeicherte Flüge</p>${!history?'<div class="warn">Für den gespeicherten Monatsverlauf Push-Dienst 1.2.25 und Bootstrap 1.2.8 installieren.</div>':!historyReady?'<div class="empty">'+(card._comatError?'Verlauf nicht erreichbar. Erneuter Versuch folgt.':'Verlauf wird geladen …')+'</div>':`<div class="flights">${renderFlights(history.flights||[],'history')||'<div class="empty">Für diesen Tag wurden keine Flüge gespeichert.</div>'}</div>${section('history-events','Ereignisse an diesem Tag',logs(history.events||[]),(history.events||[]).length)}`}<p class="foot">Gespeichert wird der letzte bekannte Stand je Flugtag, auch bei geschlossenem Dashboard. Frühere, bereits gelöschte Flüge lassen sich nicht rückwirkend ergänzen.</p>`;
      return css+`<div class="cm"><div class="hero"><div><div class="eyebrow">PI · BETRIEBSÜBERSICHT</div><h1>ComatAlarm</h1><p class="muted">Flüge, Datenquellen und Push-Versand an einem Ort</p></div>${pill(readStale?'Verbindung unterbrochen':cycleStale?'Abfragezyklus prüfen':'Pi-Abfragezyklus aktuell',readStale?'red':cycleStale?'orange':'green')}</div>
      ${readStale?`<div class="warn">${esc(card._comatError||'Datenabruf verzögert')} Zuletzt geladener Stand: ${clock(d.generated_at)}</div>`:''}
      <div class="stats">${box('Flüge im Pi',flights.length,'Geräteübergreifend zusammengefasst')}${box('Letzter Zyklus',clock(d.cycle_finished),cycleAge===null?'Noch nicht beendet':'Vor '+age(Math.max(0,cycleAge)))}${box('Push ausstehend',d.pushes.pending,'Warteschlange · bis 15 Minuten')}${box('Apple angenommen',d.pushes.accepted,'Gespeicherte Meldungen · bis 48 h')}${box('Push abgelaufen',d.pushes.expired,'Ohne Annahme nach 15 Minuten')}${box('Standplatzmodell',d.stand_model.ready?'Bereit':'Nicht bereit',`${d.stand_model.observations||0} bestätigte Ankünfte gelernt`)}</div>
      ${section('api','API-Status',`<p class="muted">Derselbe gespeicherte Status wie in der App · geprüft ${clock(d.api_status.checked_at)} ${apiAge===null||apiAge>(d.api_status.valid_for||1800)?'· Status veraltet / fehlt':''}</p>
      <div class="apis">${['FR24','FlightStats','FlightAware','BER','ADSB.lol','OpenSky'].map(name=>{const value=apis[name]||'Noch nicht geprüft';return `<div class="api"><b>${name}</b>${pill(value,value==='OK'?'green':/HTTP|Fehler|abgelehnt|ungültig/i.test(value)?'red':'orange')}</div>`;}).join('')}</div>`)}
      ${['waiting','active','completed'].map((category,i)=>{const list=flights.filter(f=>categoryOf(f)===category);return section(category,['Wartende Flüge','Aktive Flüge','Abgeschlossene Flüge'][i],`<div class="flights">${renderFlights(list,'live')||'<div class="empty">Keine Flüge in diesem Bereich.</div>'}</div>`,list.length);}).join('')}
      ${section('history','Verlauf · '+monthTitle,historyHtml)}
      ${section('events','Ereignisse & Push-Versand',`<p class="muted">„Apple angenommen“ bestätigt die Übergabe an APNs. Eine Zustell- oder Lesebestätigung des iPhones liegt nicht vor.</p><div class="panel">${logs(events.filter(e=>e.kind!=='error'))}</div>
      `,events.filter(e=>e.kind!=='error').length)}
      ${section('errors','Fehlerprotokoll',`<div class="panel">${logs(events.filter(e=>e.kind==='error'||e.kind==='push_failed'))}</div>
      `,events.filter(e=>['error','push_failed'].includes(e.kind)).length)}
      ${section('devices','Geräte & Übergabe',`<div class="panel scroll"><table><thead><tr><th>Gerät</th><th>Überwachung</th><th>Letzter App-Abruf</th><th>Gültig bis</th></tr></thead><tbody>${d.devices.map(x=>`<tr><td>${esc(x.name)}</td><td>${pill(x.expired?'Abgelaufen':x.error?'Fehler':!x.token_present?'API-Zugang fehlt':x.server_polling?'Pi zentral':'App / Pi',x.expired||x.error||!x.token_present?'orange':'green')}</td><td>${clock(x.last_app_read)}</td><td>${clock(x.expires)}</td></tr>`).join('')}</tbody></table></div>
      `,d.devices.length)}
      <p class="foot">Monitor aktualisiert alle 15 Sekunden, ohne zusätzliche Anbieter-Abfragen. Pi-Start: ${clock(d.started_at)} · Zyklusbeginn: ${clock(d.cycle_started)} · Datenstand: ${clock(d.generated_at)}. Letzte 150 Diagnoseeinträge; bis zu 1000 bleiben über Neustarts erhalten. Geräte sind pseudonymisiert.</p></div>`;
      ]]]
