name: Build signed IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/CallWebhook.p12"
          PROFILE_PATH="$RUNNER_TEMP/CallWebhook.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/CallWebhook-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project CallWebhook.xcodeproj \
            -scheme CallWebhook \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            build

      - name: Verify signature and Default Dialer entitlement
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/CallWebhook.app"
          PROFILE_PATH="$APP_PATH/embedded.mobileprovision"
          APP_ENTITLEMENTS="$RUNNER_TEMP/app-entitlements.plist"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements "$APP_ENTITLEMENTS" "$APP_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          echo "===== SIGNED APP ENTITLEMENTS ====="
          plutil -p "$APP_ENTITLEMENTS"
          echo "===== EMBEDDED PROFILE ENTITLEMENTS ====="
          plutil -extract Entitlements xml1 -o - "$PROFILE_PLIST" | plutil -p -

          APP_DIALER="$(plutil -extract com.apple.developer.dialing-app raw "$APP_ENTITLEMENTS" 2>/dev/null || true)"
          PROFILE_DIALER="$(plutil -extract Entitlements.com.apple.developer.dialing-app raw "$PROFILE_PLIST" 2>/dev/null || true)"
          APP_IDENTIFIER="$(plutil -extract application-identifier raw "$APP_ENTITLEMENTS" 2>/dev/null || true)"
          PROFILE_IDENTIFIER="$(plutil -extract Entitlements.application-identifier raw "$PROFILE_PLIST" 2>/dev/null || true)"
          BUNDLE_IDENTIFIER="$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")"

          echo "===== DEFAULT DIALER DIAGNOSTICS ====="
          echo "Bundle identifier: $BUNDLE_IDENTIFIER"
          echo "Signed app dialing-app: $APP_DIALER"
          echo "Profile dialing-app: $PROFILE_DIALER"
          echo "Signed app application-identifier: $APP_IDENTIFIER"
          echo "Profile application-identifier: $PROFILE_IDENTIFIER"

          test "$APP_DIALER" = "true"
          test "$PROFILE_DIALER" = "true"
          test "$APP_IDENTIFIER" = "$PROFILE_IDENTIFIER"
          case "$APP_IDENTIFIER" in
            *."$BUNDLE_IDENTIFIER") ;;
            *) echo "application-identifier does not match bundle identifier"; exit 1 ;;
          esac

          echo "DEFAULT_DIALER_SIGNING_OK=true"

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CallWebhook.app Payload/
          zip -r CallWebhook-signed.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CallWebhook-signed
          path: CallWebhook-signed.ipa
