name: Release approved CallWebhook mailbox update to TestFlight
run-name: CallWebhook mailbox TestFlight release · ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [codex/festnetz-mailbox-transcription]
    paths:
      - .github/workflows/release-mailbox-testflight.yml
      - scripts/mailbox_testflight.py
permissions:
  contents: read
  actions: read
concurrency:
  group: callwebhook-testflight-main
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'oooonoooorenoooo/-CallWebhook' && github.ref == 'refs/heads/codex/festnetz-mailbox-transcription'
    runs-on: macos-26
    timeout-minutes: 35
    outputs:
      build_number: ${{ steps.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the approved app source and branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TESTED_SHA=27e9fe705ed51de97293438f82b69023f2afd82b
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/festnetz-mailbox-transcription" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45862073847" --jq '.head_sha')" = "$TESTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45862073847" --jq '.conclusion')" = success
          git diff --exit-code "$TESTED_SHA" HEAD -- CallWebhook/
      - name: Check release selection and mailbox behavior
        run: |
          python3 -m unittest discover -s tests -p test_mailbox_testflight.py -v
          swiftc CallWebhook/MailboxTranscription.swift CallWebhook/MailboxModel.swift tests/MailboxConnectionTests.swift -o "$RUNNER_TEMP/mailbox-connection-tests"
          "$RUNNER_TEMP/mailbox-connection-tests"
          swiftc CallWebhook/MailboxTranscription.swift CallWebhook/MailboxModel.swift tests/MailboxTranscriptionTests.swift -o "$RUNNER_TEMP/mailbox-transcription-tests"
          "$RUNNER_TEMP/mailbox-transcription-tests"
      - name: Select a new Apple build number
        id: prepare
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/mailbox_testflight.py prepare
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install existing distribution signing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          CERT_PATH="$RUNNER_TEMP/CallWebhook-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/CallWebhookTF.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/CallWebhook-distribution.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          python3 scripts/ensure_push_profile.py "$PROFILE_PATH" production
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          PROFILE_NAME="$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Preserve approved CarPlay and Siri capabilities
        run: |
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" > "$RUNNER_TEMP/capability-profile.plist"
          python3 scripts/configure_carplay.py "$RUNNER_TEMP/capability-profile.plist" CallWebhook/CallWebhook.entitlements
          xcodegen generate
      - name: Archive the current app for TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CALLWEBHOOK_PUSH_RELAY_URL: ${{ vars.CALLWEBHOOK_PUSH_RELAY_URL }}
          BUILD_NUMBER: ${{ steps.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild archive -project CallWebhook.xcodeproj -scheme CallWebhook -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CallWebhook.xcarchive" CALLWEBHOOK_PUSH_RELAY_URL="$CALLWEBHOOK_PUSH_RELAY_URL" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" APS_ENVIRONMENT=production MARKETING_VERSION=2.0 CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/mailbox-release-build.log"
      - name: Verify archive resources and calling capabilities
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/CallWebhook.xcarchive/Products/Applications/CallWebhook.app"
          python3 scripts/verify_siri_vocabulary.py "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/archive-entitlements.plist" 2>/dev/null
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/archive-profile.plist"
          for CAPABILITY in com.apple.developer.calling-app com.apple.developer.dialing-app com.apple.developer.carplay-communication; do
            test "$(/usr/libexec/PlistBuddy -c "Print :$CAPABILITY" "$RUNNER_TEMP/archive-entitlements.plist")" = true
            test "$(/usr/libexec/PlistBuddy -c "Print :Entitlements:$CAPABILITY" "$RUNNER_TEMP/archive-profile.plist")" = true
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP_PATH/Info.plist")" = voip
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/archive-entitlements.plist")" = production
          test "$(/usr/libexec/PlistBuddy -c 'Print :CallWebhookPushEnvironment' "$APP_PATH/Info.plist")" = production
      - name: Export the signed App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          options = {"method": "app-store-connect", "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual", "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {"de.reno.CallWebhook.U98PKCA4W7": os.environ["PROFILE_NAME"]},
              "manageAppVersionAndBuildNumber": False, "uploadSymbols": True}
          Path(os.environ["RUNNER_TEMP"], "ExportOptions.plist").write_bytes(plistlib.dumps(options))
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CallWebhook.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Verify the exact exported IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ steps.prepare.outputs.build_number }}
          TESTFLIGHT_IPA: ${{ runner.temp }}/export/CallWebhook.ipa
        run: python3 scripts/mailbox_testflight.py verify_ipa
      - name: Upload the approved current build to Apple
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/festnetz-mailbox-transcription" --jq '.object.sha')" = "$GITHUB_SHA"
          umask 077
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/CallWebhook.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/mailbox-testflight-upload.log"
      - uses: actions/upload-artifact@v4
        with:
          name: CallWebhook-TestFlight-${{ steps.prepare.outputs.build_number }}
          path: ${{ runner.temp }}/export/CallWebhook.ipa
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CallWebhook-TestFlight-release-input
          path: ${{ runner.temp }}/callwebhook-mailbox-testflight/result.json
          overwrite: true
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CallWebhook-TestFlight-build-log
          overwrite: true
          path: |
            ${{ runner.temp }}/mailbox-release-build.log
            ${{ runner.temp }}/mailbox-testflight-upload.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/CallWebhook-distribution.keychain-db" || true
          rm -f "$RUNNER_TEMP/CallWebhook-distribution.p12" "$RUNNER_TEMP/CallWebhookTF.mobileprovision"

  verify-availability:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CallWebhook-TestFlight-release-input
          path: ${{ runner.temp }}/callwebhook-mailbox-testflight
      - name: Confirm Apple processing and existing internal TestFlight access
        env:
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 scripts/mailbox_testflight.py complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CallWebhook-TestFlight-publication-result
          path: ${{ runner.temp }}/callwebhook-mailbox-testflight/result.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
