name: CallWebhookMac
packages:
  LinphoneMacSDK:
    path: .sdk/linphone
targets:
  CallWebhookMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - CallWebhookMac
      - ../CallWebhook/SIPDialNumber.swift
      - ../CallWebhook/LocalCallHistory.swift
    dependencies:
      - package: LinphoneMacSDK
        product: linphonesw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reno.CallWebhookMac
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: U98PKCA4W7
        INFOPLIST_KEY_CFBundleDisplayName: CallWebhook
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: CallWebhook verbindet sich mit deiner Telefonanlage und Home Assistant im Heimnetz.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: CallWebhook benötigt das Mikrofon für Festnetztelefonate.
        INFOPLIST_KEY_NSContactsUsageDescription: CallWebhook zeigt Namen aus deinen Kontakten an.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        CODE_SIGN_ENTITLEMENTS: CallWebhookMac/CallWebhookMac.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @loader_path/Frameworks
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
