name: Build signed IPA and TestFlight
# TestFlight retry after distribution certificate secret update

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  development:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test Home Assistant setup
        run: python3 -m unittest discover -s tests -v
      - name: Test authenticated push relay
        run: |
          python3 -m venv "$RUNNER_TEMP/relay-tests"
          "$RUNNER_TEMP/relay-tests/bin/pip" install -r push_relay/requirements.txt
          "$RUNNER_TEMP/relay-tests/bin/python" -m unittest discover -s push_relay/tests -v
      - name: Test FRITZ phone-number list parsing
        run: |
          swiftc CallWebhook/FritzPhoneNumbers.swift tests/FritzPhoneNumbersTests.swift -o "$RUNNER_TEMP/fritz-number-tests"
          "$RUNNER_TEMP/fritz-number-tests"
      - name: Test mobile forwarding codes
        run: |
          swiftc CallWebhook/MobileProviders.swift tests/MobileForwardingTests.swift -o "$RUNNER_TEMP/mobile-forwarding-tests"
          "$RUNNER_TEMP/mobile-forwarding-tests"
      - name: Test emergency cellular routing without placing calls
        run: |
          swiftc CallWebhook/CellularRouting.swift tests/CellularRoutingTests.swift -o "$RUNNER_TEMP/cellular-routing-tests"
          "$RUNNER_TEMP/cellular-routing-tests"
      - name: Test existing FRITZ SIP client readiness
        run: |
          swiftc CallWebhook/FritzSIPReadiness.swift tests/FritzSIPReadinessTests.swift -o "$RUNNER_TEMP/fritz-sip-readiness-tests"
          "$RUNNER_TEMP/fritz-sip-readiness-tests"
      - name: Test mailbox connection and SIP number handling
        run: |
          swiftc CallWebhook/MailboxModel.swift tests/MailboxConnectionTests.swift -o "$RUNNER_TEMP/mailbox-connection-tests"
          "$RUNNER_TEMP/mailbox-connection-tests"
          swiftc CallWebhook/SIPDialNumber.swift tests/SIPDialNumberTests.swift -o "$RUNNER_TEMP/sip-dial-number-tests"
          "$RUNNER_TEMP/sip-dial-number-tests"
      - name: Test incoming dialplan
        run: |
          swiftc CallWebhook/IncomingDialplan.swift tests/IncomingDialplanTests.swift -o "$RUNNER_TEMP/incoming-dialplan-tests"
          "$RUNNER_TEMP/incoming-dialplan-tests"
      - name: Test local call history
        run: |
          swiftc CallWebhook/LocalCallHistory.swift tests/LocalCallHistoryTests.swift -o "$RUNNER_TEMP/call-history-tests"
          "$RUNNER_TEMP/call-history-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install development signing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/CallWebhook.p12"
          PROFILE_PATH="$RUNNER_TEMP/CallWebhook.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/CallWebhook-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          python3 scripts/ensure_push_profile.py "$PROFILE_PATH" development
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Prepare AppIcon filename
        run: |
          if [ -f CallWebhook/Assets.xcassets/AppIcon.appiconset/AppIcon-1024 ]; then
            mv CallWebhook/Assets.xcassets/AppIcon.appiconset/AppIcon-1024 CallWebhook/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.jpg
          fi
      - name: Generate project
        run: xcodegen generate
      - name: Build development IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CALLWEBHOOK_PUSH_RELAY_URL: ${{ vars.CALLWEBHOOK_PUSH_RELAY_URL }}
        run: |
          xcodebuild -project CallWebhook.xcodeproj CALLWEBHOOK_PUSH_RELAY_URL="$CALLWEBHOOK_PUSH_RELAY_URL" -scheme CallWebhook -configuration Release -sdk iphoneos -derivedDataPath build DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Development" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" build
          APP_PATH="build/Build/Products/Release-iphoneos/CallWebhook.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/development-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.calling-app' "$RUNNER_TEMP/development-entitlements.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/development-entitlements.plist")" = "development"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CallWebhookPushEnvironment' "$APP_PATH/Info.plist")" = "development"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP_PATH/Info.plist")" = "voip"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r CallWebhook-signed.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CallWebhook-signed
          path: CallWebhook-signed.ipa

  testflight:
    needs: development
    runs-on: macos-26
    concurrency:
      group: callwebhook-testflight-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install distribution signing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_DISTRIBUTION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/CallWebhook-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/CallWebhookTF.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/CallWebhook-distribution.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          python3 scripts/ensure_push_profile.py "$PROFILE_PATH" production
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          PROFILE_NAME="$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Prepare AppIcon filename
        run: |
          if [ -f CallWebhook/Assets.xcassets/AppIcon.appiconset/AppIcon-1024 ]; then
            mv CallWebhook/Assets.xcassets/AppIcon.appiconset/AppIcon-1024 CallWebhook/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.jpg
          fi
      - name: Generate project
        run: xcodegen generate
      - name: Archive for App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CALLWEBHOOK_PUSH_RELAY_URL: ${{ vars.CALLWEBHOOK_PUSH_RELAY_URL }}
        run: |
          xcodebuild archive -project CallWebhook.xcodeproj CALLWEBHOOK_PUSH_RELAY_URL="$CALLWEBHOOK_PUSH_RELAY_URL" -scheme CallWebhook -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/CallWebhook.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" APS_ENVIRONMENT=production
      - name: Verify archived Default Dialer entitlement
        run: |
          APP_PATH="$RUNNER_TEMP/CallWebhook.xcarchive/Products/Applications/CallWebhook.app"
          APP_ENTITLEMENTS="$RUNNER_TEMP/archive-entitlements.plist"
          PROFILE_PLIST="$RUNNER_TEMP/archive-profile.plist"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$APP_ENTITLEMENTS" 2>/dev/null
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$PROFILE_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.dialing-app' "$APP_ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.dialing-app' "$PROFILE_PLIST")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.calling-app' "$APP_ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.calling-app' "$PROFILE_PLIST")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP_PATH/Info.plist")" = "voip"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$APP_ENTITLEMENTS")" = "production"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CallWebhookPushEnvironment' "$APP_PATH/Info.plist")" = "production"
          echo "TESTFLIGHT_DEFAULT_DIALER_AND_CALLING_SIGNING_OK=true"
      - name: Export App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict>
          <key>de.reno.CallWebhook.U98PKCA4W7</key><string>$PROFILE_NAME</string>
          </dict>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CallWebhook.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/export/CallWebhook.ipa" CallWebhook-TestFlight.ipa
      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          LATEST_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$LATEST_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "Neuere main-Version vorhanden: $LATEST_MAIN_SHA"
            echo "Dieser Zwischenstand ($GITHUB_SHA) wird nicht zu TestFlight hochgeladen."
            exit 0
          fi
          xcrun altool --upload-app -f CallWebhook-TestFlight.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: CallWebhook-TestFlight
          path: CallWebhook-TestFlight.ipa
