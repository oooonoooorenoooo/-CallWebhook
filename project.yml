name: CallWebhook
options:
  bundleIdPrefix: de.reno
packages:
  LinphoneSDK:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-ios.git
    branch: stable
targets:
  CallWebhook:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    supportedDestinations: [iOS]
    sources:
      - CallWebhook
    dependencies:
      - package: LinphoneSDK
        product: linphonesw
    info:
      path: CallWebhook/Info.plist
      properties:
        CallWebhookTeamID: $(DEVELOPMENT_TEAM)
        CallWebhookPushEnvironment: $(APS_ENVIRONMENT)
        CallWebhookPushRelayURL: $(CALLWEBHOOK_PUSH_RELAY_URL)
        CFBundleURLTypes:
          - CFBundleURLName: de.reno.CallWebhook.oauth
            CFBundleURLSchemes:
              - callwebhook
          - CFBundleURLName: de.reno.CallWebhook.calling
            CFBundleURLSchemes:
              - tel
        UIBackgroundModes:
          - voip
        NSUserActivityTypes:
          - INStartCallIntent
          - INStartAudioCallIntent
    settings:
      base:
        APS_ENVIRONMENT: development
        CALLWEBHOOK_PUSH_RELAY_URL: ""
        PRODUCT_BUNDLE_IDENTIFIER: de.reno.CallWebhook.U98PKCA4W7
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_CFBundleDisplayName: CallWebhook
        INFOPLIST_KEY_NSContactsUsageDescription: CallWebhook benötigt Zugriff auf deine Kontakte, um Namen und Kontaktbilder im Telefonbuch anzuzeigen.
        INFOPLIST_KEY_NSCameraUsageDescription: CallWebhook enthält eine VoIP-Bibliothek, die auf Kamera-APIs zugreifen kann. Kamerazugriff wird nur für zukünftige Kommunikationsfunktionen verwendet.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: CallWebhook benötigt Zugriff auf das Mikrofon, damit du VoIP-Telefonate über Asterisk führen kannst.
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @loader_path/Frameworks
        CODE_SIGN_ENTITLEMENTS: CallWebhook/CallWebhook.entitlements
