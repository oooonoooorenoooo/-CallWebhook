name: SIPServiceRegression
packages:
  SDK:
    path: ../../macOS/.sdk/linphone
targets:
  SIPServiceRegression:
    type: application
    platform: macOS
    deploymentTarget: '13.0'
    sources:
      - Harness.swift
      - ../../CallWebhook/SIPService.swift
      - ../../CallWebhook/SIPCallTermination.swift
      - ../../CallWebhook/LocalCallHistory.swift
      - ../../CallWebhook/SIPDialNumber.swift
      - ../../CallWebhook/CellularRouting.swift
    dependencies:
      - package: SDK
        product: linphonesw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reno.CallWebhook.SIPServiceRegression
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
