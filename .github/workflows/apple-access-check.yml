name: Check Apple tester authorization
on:
  push:
    branches: [apple-tester-access]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r push_relay/requirements.txt
      - run: python -m unittest discover -s push_relay/tests -v
