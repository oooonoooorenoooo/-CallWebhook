name: CallWebhook branch builds
run-name: CallWebhook ${{ github.ref_name }} · ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [codex/macos-line3]
permissions:
  contents: read
concurrency:
  group: callwebhook-branch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact build source (no credentials or build files)
        run: git archive --format=zip --output="$RUNNER_TEMP/CallWebhook-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: CallWebhook-source-${{ github.sha }}
          path: ${{ runner.temp }}/CallWebhook-source.zip
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Test backend and isolated Mac routing
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s macOS/tests -v
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK and generate Mac project
        run: |
          python3 macOS/bootstrap_sdk.py
          brew install xcodegen
          xcodegen generate --spec macOS/project.yml
      - name: Build Mac app
        run: |
          set -o pipefail
          xcodebuild -project macOS/CallWebhookMac.xcodeproj -scheme CallWebhookMac -configuration Debug -destination 'platform=macOS' -derivedDataPath macOS/.build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/mac-build.log"
          ditto -c -k --keepParent macOS/.build/Build/Products/Debug/CallWebhookMac.app "$RUNNER_TEMP/CallWebhookMac-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CallWebhookMac-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/CallWebhookMac-unsigned.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/mac-build.log
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test call outcomes and mailbox connection
        run: |
          swiftc CallWebhook/LocalCallHistory.swift CallWebhook/MissedCallState.swift CallWebhook/SIPCallTermination.swift tests/SIPCallTerminationTests.swift -o "$RUNNER_TEMP/call-tests"
          "$RUNNER_TEMP/call-tests"
          swiftc CallWebhook/MailboxModel.swift tests/MailboxConnectionTests.swift -o "$RUNNER_TEMP/mailbox-tests"
          "$RUNNER_TEMP/mailbox-tests"
      - name: Generate iPhone project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile iPhone app (no signing or deployment)
        run: |
          set -o pipefail
          xcodebuild -project CallWebhook.xcodeproj -scheme CallWebhook -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/ios-build.log
